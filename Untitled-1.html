<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - Main Landing Page</title>
    <style>
        /* General Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #ffffff;
    color: #333;
    padding-bottom: 80px; /* Space for FAB */
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #333; /* Wireframe look */
    border-radius: 8px;
    position: relative;
}

/* Header */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #333;
    margin-bottom: 20px;
}

.logo { font-size: 1.5rem; font-weight: bold; }
.user-profile {
    width: 35px;
    height: 35px;
    border: 2px solid #333;
    border-radius: 50%;
}

/* Banner */
.banner {
    height: 250px;
    border: 1px solid #333;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
}

/* Controls */
.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

.search-bar {
    flex-grow: 1;
    padding: 10px;
    border: 1px solid #333;
    border-radius: 8px;
}

.buttons button {
    padding: 10px 15px;
    border: 1px solid #333;
    background: white;
    border-radius: 8px;
    cursor: pointer;
}

/* Grid Sections */
.section { margin-bottom: 40px; }
.section-title {
    font-size: 1.2rem;
    margin-bottom: 15px;
    border-bottom: 1px solid #333;
    padding-bottom: 5px;
}

.grid {
    display: grid;
    gap: 15px;
}

.regional-grid { grid-template-columns: repeat(5, 1fr); }
.trip-grid { grid-template-columns: repeat(4, 1fr); }

.card {
    border: 1px solid #333;
    border-radius: 12px;
    background: #fcfcfc;
}

.square { aspect-ratio: 1 / 1; }
.tall { height: 250px; }

/* Floating Action Button */
.fab {
    position: fixed;
    bottom: 30px;
    right: 30px;
    padding: 12px 24px;
    border: 1px solid #333;
    background: white;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.1);
}
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">Traveloop</div>
        <div class="user-profile"></div>
    </header>

    <main class="container">
        <section class="banner">
            <h1>Banner Image</h1>
        </section>

        <section class="controls">
            <input type="text" placeholder="Search bar ......" class="search-bar">
            <div class="buttons">
                <button>Group by</button>
                <button>Filter</button>
                <button>Sort by...</button>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Top Regional Selections</h2>
            <div class="grid regional-grid">
                <div class="card square"></div>
                <div class="card square"></div>
                <div class="card square"></div>
                <div class="card square"></div>
                <div class="card square"></div>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Previous Trips</h2>
            <div class="grid trip-grid">
                <div class="card tall"></div>
                <div class="card tall"></div>
                <div class="card tall"></div>
                <div class="card tall"></div>
            </div>
        </section>

        <button class="fab">+ Plan a trip</button>
    </main>

</body>
</html>
